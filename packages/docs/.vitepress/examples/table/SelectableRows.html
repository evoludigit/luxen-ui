<l-data-table selectable>
  <table class="l-table">
    <caption>
      Products
    </caption>
    <thead>
      <tr>
        <th
          scope="col"
          data-select
        ></th>
        <th scope="col">SKU</th>
        <th scope="col">Name</th>
        <th
          scope="col"
          data-type="number"
        >
          In stock
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-select>
          <input
            type="checkbox"
            class="l-checkbox"
            name="product"
            value="sku-1042"
            aria-label="Select SKU-1042"
          />
        </td>
        <th scope="row">SKU-1042</th>
        <td>Desk lamp</td>
        <td data-type="number">4,210</td>
      </tr>
      <tr>
        <td data-select>
          <input
            type="checkbox"
            class="l-checkbox"
            name="product"
            value="sku-2087"
            aria-label="Select SKU-2087"
          />
        </td>
        <th scope="row">SKU-2087</th>
        <td>Office chair</td>
        <td data-type="number">12,004</td>
      </tr>
      <tr>
        <td data-select>
          <input
            type="checkbox"
            class="l-checkbox"
            name="product"
            value="sku-3110"
            aria-label="Select SKU-3110"
          />
        </td>
        <th scope="row">SKU-3110</th>
        <td>Standing desk</td>
        <td data-type="number">865</td>
      </tr>
      <tr>
        <td data-select>
          <input
            type="checkbox"
            class="l-checkbox"
            name="product"
            value="sku-4021"
            aria-label="Select SKU-4021"
          />
        </td>
        <th scope="row">SKU-4021</th>
        <td>Monitor arm</td>
        <td data-type="number">2,390</td>
      </tr>
    </tbody>
  </table>
</l-data-table>
